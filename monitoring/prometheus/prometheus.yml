global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/slo-alerts.yml
  - /etc/prometheus/rules/oracle-service-alerts.yml

scrape_configs:
  - job_name: 'iln-indexer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['indexer:3001']

  - job_name: 'iln-oracle'
    metrics_path: '/v1/metrics'
    static_configs:
      - targets: ['oracle-service:3010']

  - job_name: 'iln-notifications'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notifications:4001']
