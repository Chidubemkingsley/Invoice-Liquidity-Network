name: Weekly Observability Digest

on:
  schedule:
    # Run every Monday at 08:00 UTC (coordinated with ILN-Frontend weekly digest schedule)
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  generate-digest:
    name: Generate Main Repo Weekly Observability Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '9'

      - name: Generate Observability Digest Report
        run: |
          pnpm exec tsx scripts/weekly-observability-digest.ts

      - name: Post Digest to Job Summary
        run: |
          cat reports/observability/weekly-digest-latest.md >> $GITHUB_STEP_SUMMARY

      - name: Archive Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-observability-digest-main-repo
          path: reports/observability/weekly-digest-latest.md
